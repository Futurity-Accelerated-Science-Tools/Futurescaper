version: '3.8'

services:
  futurescape:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Set your DeepSeek API key here for testing
        # Get one at: https://platform.deepseek.com/api_keys
        VITE_DEEPSEEK_API_KEY: ${VITE_DEEPSEEK_API_KEY:-}
        # Optional: Other providers
        VITE_OPENAI_API_KEY: ${VITE_OPENAI_API_KEY:-}
        VITE_GROQ_API_KEY: ${VITE_GROQ_API_KEY:-}
        VITE_GEMINI_API_KEY: ${VITE_GEMINI_API_KEY:-}
        VITE_CLAUDE_API_KEY: ${VITE_CLAUDE_API_KEY:-}
        VITE_OPENROUTER_API_KEY: ${VITE_OPENROUTER_API_KEY:-}
    ports:
      - "3000:80"
    restart: unless-stopped
    container_name: futurescape-app

# ===========================================
# QUICK START:
# ===========================================
# Option 1: Using .env file (recommended)
#   1. Copy .env.example to .env
#   2. Add your DeepSeek API key
#   3. Run: docker-compose up -d --build
#
# Option 2: Inline command
#   VITE_DEEPSEEK_API_KEY=sk-your-key docker-compose up -d --build
#
# Option 3: Export first
#   export VITE_DEEPSEEK_API_KEY=sk-your-key
#   docker-compose up -d --build
# ===========================================
