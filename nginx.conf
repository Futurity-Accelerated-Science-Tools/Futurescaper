server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API proxies for web research (avoids CORS)
    location /api/news-proxy/ {
        proxy_pass https://news.google.com/;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
        proxy_set_header Host news.google.com;
        proxy_set_header User-Agent "Mozilla/5.0 (compatible; FuturescapeBot/1.0)";
        proxy_connect_timeout 10s;
        proxy_read_timeout 15s;
    }

    location /api/bing-news-proxy/ {
        proxy_pass https://www.bing.com/;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
        proxy_set_header Host www.bing.com;
        proxy_set_header User-Agent "Mozilla/5.0 (compatible; FuturescapeBot/1.0)";
        proxy_connect_timeout 10s;
        proxy_read_timeout 15s;
    }

    location /api/scholar-proxy/ {
        proxy_pass https://api.semanticscholar.org/;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
        proxy_set_header Host api.semanticscholar.org;
        proxy_connect_timeout 10s;
        proxy_read_timeout 15s;
    }

    # Handle SPA routing - all routes go to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Logging for debugging proxy issues
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
}
